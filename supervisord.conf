[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700
chown=nextjs:nodejs

[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/app/logs
user=nextjs

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:nextjs]
command=bun run start
directory=/app
autostart=true
autorestart=true
startretries=3
stderr_logfile=/app/logs/nextjs-error.log
stdout_logfile=/app/logs/nextjs-output.log
environment=NODE_ENV="production",PORT="3000"
user=nextjs
priority=100

[program:whatsapp-service]
command=bun run start
directory=/app/whatsapp-service
autostart=true
autorestart=true
startretries=3
stderr_logfile=/app/logs/whatsapp-error.log
stdout_logfile=/app/logs/whatsapp-output.log
environment=NODE_ENV="production",PORT="3001"
user=nextjs
priority=200
